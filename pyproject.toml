[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grxt-ws-proxy"
version = "0.1.0"
description = "Desktop-first local Telegram proxy with automatic route recovery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
grxt-ws-proxy = "grxt_ws_proxy.app:main"
grxt-ws-proxy-core = "grxt_ws_proxy.core.service:main"

[tool.setuptools.packages.find]
where = ["src"]
