name: GRXT WS Proxy v0.5 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pyinstaller
      - name: Tests
        run: pytest -q
      - name: Import smoke test
        run: python -c "import grxt_ws_proxy; print(getattr(grxt_ws_proxy, '__version__', 'unknown'))"
      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile \
            --name GRXT-WS-Proxy-linux-x86_64 \
            --collect-all proxy --collect-all grxt_ws_proxy launcher.py
          file dist/GRXT-WS-Proxy-linux-x86_64

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
